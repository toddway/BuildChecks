name: Release

# Tag a release (e.g. `git tag v4.0.0 && git push origin v4.0.0`) to build the self-contained
# fat jar and attach it to a GitHub Release. The first-party Action (action.yml) and the
# `java -jar` recipes download this asset. Maven Central publishing is a separate manual step
# (see MAINTAINING.md) because it needs the signing key and Central token.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble
      - name: Create release with the fat jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/libs/buildchecks-*-all.jar
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
