name: Release

# Cut a release with `./release.sh <version>` then `git push origin main <tag>`. release.sh bumps
# the version, builds the reproducible fat jar, pins the Homebrew formula to its checksum, commits,
# and tags — so the tag already carries a correct formula. On the tag this workflow: builds the fat
# jar and attaches it to a GitHub Release; publishes the thin jar + POM to the `gh-pages` Maven repo
# (so Gradle can resolve `com.toddway:buildchecks`); and verifies the formula checksum matches.
# Everything authenticates with the built-in GITHUB_TOKEN — no signing keys or Sonatype tokens.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble

      - name: Create release with the fat jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/libs/buildchecks-*-all.jar
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes

      - name: Publish Maven repo to the gh-pages branch
        run: |
          ./gradlew publishMavenPublicationToPagesRepository

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check out gh-pages in a separate worktree, creating it as an orphan on the first release.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add pages gh-pages
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . >/dev/null 2>&1 || true
          fi

          # Merge the new artifacts in (previous versions accumulate); .nojekyll keeps GitHub Pages
          # from mangling the Maven metadata files.
          touch pages/.nojekyll
          cp -R build/maven-repo/. pages/
          git -C pages add -A
          git -C pages commit -m "Publish Maven artifacts for ${GITHUB_REF_NAME}" \
            || { echo "nothing new to publish"; exit 0; }
          git -C pages push origin gh-pages

      - name: Verify the Homebrew formula matches the released jar
        run: |
          # The formula is pinned by release.sh before tagging (reproducible jar → matching sha).
          # This fails the release loudly if they drift, so a bad checksum is never published.
          VERSION="${GITHUB_REF_NAME#v}"
          built=$(sha256sum "build/libs/buildchecks-${VERSION}-all.jar" | awk '{print $1}')
          pinned=$(grep -oE '[0-9a-f]{64}' Formula/buildchecks.rb | head -1)
          if [ "$built" != "$pinned" ]; then
            echo "::error::Formula sha256 ($pinned) != built jar ($built). Run ./release.sh $VERSION and re-tag." >&2
            exit 1
          fi
          echo "Formula checksum verified: $built"
